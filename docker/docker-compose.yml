version: '3.6'
name: compiler-api
services:
  server:
    container_name: compiler-api
    build: .
    restart: always
    ports:
      - "9000:9000"
    working_dir: /app
    command: [ "./run.sh", "yarn", "dev" ]
    volumes:
      - ../compiler-api/src:/app/src
    environment:
      NODE_ENV: development
      # Refuse to compile (and to start clangd) if no sandbox can be established
      # (fail closed) instead of falling back to running the tools unconfined.
      HOOKS_REQUIRE_SANDBOX: "1"
    # Sandbox: bubblewrap needs to create user/mount namespaces, which Docker's
    # default seccomp and AppArmor profiles (and its masked /proc) do not allow,
    # even when the host enables unprivileged user namespaces. In a default
    # container the server therefore uses the Landlock fallback (landlock-exec,
    # built in the Dockerfile; Linux >= 5.13 with Landlock enabled, see
    # /sys/kernel/security/lsm). The startup log shows which one is active:
    # "compile sandbox: ACTIVE (bubblewrap)" or "ACTIVE (landlock: ...)".
